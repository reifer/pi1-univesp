{% extends 'bazar/base.html' %}
{% load static %}

{% block title %}Login - Conexão Solidária{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center pt-24 pb-20 bg-slate-50 flex-grow w-full">
    <div class="container mx-auto px-6 max-w-md w-full">

        <div class="fade-in-element text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-black text-slate-900 tracking-tight uppercase">Área Restrita</h1>
            <p class="text-slate-600 mt-2 font-medium">Acesse com seu e-mail e senha</p>
        </div>

        <div class="fade-in-element">
            <form method="POST" action="{% url 'login' %}" class="bg-white p-8 rounded-[2rem] shadow-xl border border-slate-100 space-y-6">
                {% csrf_token %}

                <div class="flex flex-col gap-2">
                    <label for="id_username" class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Usuário / E-mail</label>
                    <div class="relative">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                        </div>
                        <input
                            id="id_username"
                            name="username"
                            type="text"
                            required
                            class="w-full pl-12 pr-4 py-4 rounded-2xl border border-slate-100 focus:border-green-800 focus:ring-4 focus:ring-green-800/10 outline-none transition-all bg-slate-50 text-slate-900 font-bold"
                            placeholder="seu@email.com"
                        >
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <label for="id_password" class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Senha</label>
                    <div class="relative">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </div>
                        <input
                            id="id_password"
                            name="password"
                            type="password"
                            required
                            class="w-full pl-12 pr-12 py-4 rounded-2xl border border-slate-100 focus:border-green-800 focus:ring-4 focus:ring-green-800/10 outline-none transition-all bg-slate-50 text-slate-900 font-bold"
                            placeholder="••••••••"
                        >
                        <button
                            type="button"
                            id="toggle-password"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors z-10 cursor-pointer p-2"
                            title="Alternar visibilidade da senha"
                        >
                            <i id="password-icon" class="fa fa-eye-slash text-lg"></i>
                        </button>
                    </div>
                </div>

                {% if form.errors or messages %}
                <div class="p-4 bg-red-50 text-red-600 text-xs rounded-2xl text-center font-black uppercase tracking-tighter border border-red-100">
                    Usuário ou senha incorretos.
                </div>
                {% endif %}

                <button
                    type="submit"
                    class="w-full bg-green-800 text-white font-black py-4 rounded-2xl shadow-lg hover:bg-green-950 hover:shadow-green-600/20 transition-all duration-300 flex items-center justify-center gap-3 uppercase tracking-[0.2em] text-xs hover:-translate-y-0.5 active:translate-y-0"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
                    Entrar
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    // Toggle de visibilidade de senha
    const passwordInput = document.getElementById('id_password');
    const toggleButton = document.getElementById('toggle-password');
    const passwordIcon = document.getElementById('password-icon');

    toggleButton.addEventListener('click', function (e) {
        e.preventDefault();
        
        const isPassword = passwordInput.type === 'password';
        
        if (isPassword) {
            passwordInput.type = 'text';
            passwordIcon.classList.remove('fa-eye-slash');
            passwordIcon.classList.add('fa-eye');
        } else {
            passwordInput.type = 'password';
            passwordIcon.classList.remove('fa-eye');
            passwordIcon.classList.add('fa-eye-slash');
        }
    });
</script>
{% endblock %}
