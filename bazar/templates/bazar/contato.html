{% extends 'bazar/base.html' %}
{% load static %}

{% block content %}
<div class="bg-slate-50 flex-grow w-full">
    <div class="container mx-auto px-6">
        <div class="min-h-[calc(100vh-8rem)] pt-28 pb-24 flex items-center justify-center">
            <div class="w-full max-w-2xl">
                <div class="fade-in-element">
                    <div class="bg-white rounded-xl border border-slate-200 p-8 shadow-lg">
                        <h2 class="text-3xl md:text-4xl font-black text-slate-900 text-center mb-12 uppercase tracking-tighter">Envie sua mensagem</h2>

                        {% if messages %}
                            {% for message in messages %}
                                <div class="mb-8 p-4 rounded-xl flex items-center gap-3 {% if message.tags == 'success' %}bg-green-50 text-green-700 border border-green-100{% else %}bg-red-50 text-red-700 border border-red-100{% endif %} animate-fadeIn">
                                    {% if message.tags == 'success' %}
                                        <span class="text-xl">✉️</span>
                                    {% else %}
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                                    {% endif %}
                                    <span class="font-bold text-sm">{{ message }}</span>
                                </div>
                            {% endfor %}
                        {% endif %}

                        <form method="POST" class="space-y-8">
                            {% csrf_token %}

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="flex flex-col gap-2">
                                    <label for="nome" class="text-sm font-bold text-slate-700 mb-1 block">Nome completo</label>
                                    <div class="relative group">
                                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-600 transition-colors">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                                        </div>
                                        <input type="text" name="nome" id="nome" required
                                            class="w-full pl-12 pr-5 h-12 md:h-14 rounded-xl border-2 border-slate-200 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 bg-slate-50 text-slate-900 outline-none text-base transition-all placeholder:text-slate-400"
                                            placeholder="Nome completo">
                                    </div>
                                </div>

                                <div class="flex flex-col gap-2">
                                    <label for="email" class="text-sm font-bold text-slate-700 mb-1 block">E-mail</label>
                                    <div class="relative group">
                                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-600 transition-colors">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                                        </div>
                                        <input type="email" name="email" id="email" required
                                            class="w-full pl-12 pr-5 h-12 md:h-14 rounded-xl border-2 border-slate-200 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 bg-slate-50 text-slate-900 outline-none text-base transition-all placeholder:text-slate-400"
                                            placeholder="seu@email.com">
                                    </div>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="flex flex-col gap-2">
                                    <label for="telefone" class="text-sm font-bold text-slate-700 mb-1 block">Telefone</label>
                                    <div class="relative group">
                                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-600 transition-colors">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                                        </div>
                                        <input type="tel" name="telefone" id="telefone"
                                            class="w-full pl-12 pr-5 h-12 md:h-14 rounded-xl border-2 border-slate-200 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 bg-slate-50 text-slate-900 outline-none text-base transition-all placeholder:text-slate-400"
                                            placeholder="(11) 00000-0000">
                                    </div>
                                </div>

                                <div class="flex flex-col gap-2">
                                    <label for="assunto" class="text-sm font-bold text-slate-700 mb-1 block">Assunto</label>
                                    <div class="relative group">
                                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-600 transition-colors pointer-events-none">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
                                        </div>
                                        <select name="assunto" id="assunto" required
                                            class="w-full pl-12 pr-5 h-12 md:h-14 rounded-xl border-2 border-slate-200 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 bg-slate-50 text-slate-900 outline-none text-base transition-all appearance-none">
                                            <option value="">Selecione um assunto</option>
                                            <option value="duvida">Dúvidas sobre doações</option>
                                            <option value="sugestao">Sugestões</option>
                                            <option value="reclamacao">Reclamações</option>
                                            <option value="outros">Outros</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="flex flex-col gap-2">
                                <label for="mensagem" class="text-sm font-bold text-slate-700 mb-1 block">Mensagem</label>
                                <div class="relative group">
                                    <div class="absolute left-4 top-5 text-slate-400 group-focus-within:text-blue-600 transition-colors">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                                    </div>
                                    <textarea name="mensagem" id="mensagem" rows="5" required
                                        class="w-full pl-12 pr-5 py-4 rounded-xl border-2 border-slate-200 focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 bg-slate-50 text-slate-900 outline-none text-base transition-all placeholder:text-slate-400 min-h-[150px]"
                                        placeholder="Descreva detalhadamente sua dúvida ou solicitação..."></textarea>
                                </div>
                            </div>

                            <div class="flex md:justify-center w-full">
                                <button type="submit"
                                    class="w-full md:w-auto inline-flex items-center justify-center gap-3 px-12 h-14 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg transition-all duration-300 shadow-lg hover:shadow-blue-600/20 hover:-translate-y-0.5 active:translate-y-0 uppercase tracking-wider">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                                    Enviar Mensagem
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
