{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexão Solidária | Rede Solidária de Apoio ao Sertão</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'images/logocomfundov2.svg' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="icon" href="data:;base64,iVBORw0KGgo=">

    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: { blob: "blob 7s infinite" },
                    keyframes: {
                        blob: {
                            "0%": { transform: "translate(0px, 0px) scale(1)" },
                            "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                            "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                            "100%": { transform: "translate(0px, 0px) scale(1)" },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .fade-in-element { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
        .fade-in-visible { opacity: 1 !important; transform: translateY(0) !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col transition-colors duration-500 pt-20">

    {% include 'bazar/navbar.html' %}

    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white text-slate-600 pt-8 pb-6 mt-auto border-t border-slate-200">
        <div class="container mx-auto px-8 max-w-7xl flex flex-col items-center justify-center gap-4">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-green-50 rounded-lg flex items-center justify-center text-white shadow-sm">
                    <img src="{% static 'images/logov2.svg' %}" alt="Logo" class="w-5 h-5 object-contain">
                </div>
                <span class="text-lg font-bold tracking-tight text-green-800 uppercase">Conexão Solidária</span>
            </div>
            <div class="text-xs text-slate-500 text-center flex flex-col sm:flex-row items-center gap-2">
                <span>Bazar Solidário</span>
                <span class="hidden sm:inline">•</span>
                <span>Projeto Integrador I - Univesp</span>
                <span class="hidden sm:inline">•</span>
                <span>© 2026 • v1.0</span>
            </div>
            {% if WHATSAPP_URL %}
            <a href="{{ WHATSAPP_URL }}" target="_blank" rel="noopener noreferrer"
               class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-green-50 text-green-800 font-bold text-sm hover:bg-green-100 transition-colors">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L0 24l6.335-1.662c1.72.94 3.659 1.437 5.634 1.437h.005c6.515 0 11.849-5.334 11.851-11.893 0-3.18-1.233-6.171-3.475-8.417"/></svg>
                WhatsApp
            </a>
            {% endif %}
        </div>
    </footer>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('fade-in-visible');
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade-in-element').forEach(el => observer.observe(el));
    </script>
</body>
</html>
