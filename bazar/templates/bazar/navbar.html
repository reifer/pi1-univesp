{% load static %}

<nav class="fixed top-0 left-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
    <div class="container mx-auto px-8 max-w-7xl h-20 flex items-center justify-between">

        <div class="flex items-center gap-2">
            <a href="{% url 'index' %}" class="flex items-center gap-2">
                <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-white">
                    <img src="{% static 'images/logov2.svg' %}" alt="Logo" class="w-10 h-10 object-contain">
                </div>
                <span class="text-xl font-black tracking-tighter text-green-800 uppercase">Conexão Solidária</span>
            </a>
        </div>

        <div class="hidden md:flex items-center gap-8">
            <a href="{% url 'index' %}" class="text-sm font-bold {% if request.resolver_match.url_name == 'index' %}text-green-800 border-b-2 border-green-800{% else %}text-slate-500 hover:text-green-800{% endif %} pb-1 transition-all">Início</a>
            <a href="{% url 'cadastrar_doacao' %}" class="text-sm font-bold {% if request.resolver_match.url_name == 'cadastrar_doacao' %}text-green-800 border-b-2 border-green-800{% else %}text-slate-500 hover:text-green-800{% endif %} pb-1 transition-all">Doar</a>
            <a href="{% url 'sobre' %}" class="text-sm font-bold {% if request.resolver_match.url_name == 'sobre' %}text-green-800 border-b-2 border-green-800{% else %}text-slate-500 hover:text-green-800{% endif %} pb-1 transition-all">Sobre</a>
            <a href="{% url 'contato' %}" class="text-sm font-bold {% if request.resolver_match.url_name == 'contato' %}text-green-800 border-b-2 border-green-800{% else %}text-slate-500 hover:text-green-800{% endif %} pb-1 transition-all">Contato</a>
        </div>

        <div class="flex items-center gap-4">
            <button id="mobile-menu-button" type="button" class="block md:hidden p-2 rounded-lg border border-slate-200 text-slate-700 hover:bg-slate-100 transition-all" aria-controls="mobile-menu" aria-expanded="false" aria-label="Abrir menu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
                <a href="{% if user.is_authenticated %}{% url 'admin_dashboard' %}{% else %}{% url 'login' %}{% endif %}" class="hidden md:flex bg-green-800 text-white px-5 py-2.5 rounded-xl text-sm font-bold items-center gap-2 hover:bg-green-950 transition-all shadow-lg">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
                </svg>
                Área Restrita
            </a>
            {% if user.is_authenticated %}
                <form action="{% url 'logout' %}" method="POST" class="hidden md:inline">
                    {% csrf_token %}
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-bold border border-red-200 text-red-600 hover:bg-red-50 transition-all">
                        Sair
                    </button>
                </form>
            {% endif %}
        </div>
    </div>

    <div id="mobile-menu" class="hidden md:hidden border-t border-slate-100 bg-white/95 backdrop-blur-md">
        <div class="container mx-auto px-8 py-4 flex flex-col gap-3">
            <a href="{% url 'index' %}" class="text-sm font-bold {% if request.resolver_match.url_name == 'index' %}text-green-800{% else %}text-slate-600 hover:text-green-800{% endif %} transition-all">Início</a>
            <a href="{% url 'cadastrar_doacao' %}" class="text-sm font-bold {% if request.resolver_match.url_name == 'cadastrar_doacao' %}text-green-800{% else %}text-slate-600 hover:text-green-800{% endif %} transition-all">Doar</a>
            <a href="{% url 'sobre' %}" class="text-sm font-bold {% if request.resolver_match.url_name == 'sobre' %}text-green-800{% else %}text-slate-600 hover:text-green-800{% endif %} transition-all">Sobre</a>
            <a href="{% url 'contato' %}" class="text-sm font-bold {% if request.resolver_match.url_name == 'contato' %}text-green-800{% else %}text-slate-600 hover:text-green-800{% endif %} transition-all">Contato</a>
            <a href="{% if user.is_authenticated %}{% url 'admin_dashboard' %}{% else %}{% url 'login' %}{% endif %}" class="mt-2 bg-green-800 text-white px-4 py-2 rounded-xl text-sm font-bold text-center">Área Restrita</a>
            {% if user.is_authenticated %}
                <form action="{% url 'logout' %}" method="POST" class="mt-1">
                    {% csrf_token %}
                    <button type="submit" class="w-full px-4 py-2 rounded-xl text-sm font-bold border border-red-200 text-red-600 hover:bg-red-50 transition-all">
                        Sair
                    </button>
                </form>
            {% endif %}
        </div>
    </div>
</nav>

<script>
    (function () {
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');

        if (!mobileMenuButton || !mobileMenu) return;

        mobileMenuButton.addEventListener('click', function () {
            mobileMenu.classList.toggle('hidden');
            const isExpanded = mobileMenuButton.getAttribute('aria-expanded') === 'true';
            mobileMenuButton.setAttribute('aria-expanded', String(!isExpanded));
        });
    })();
</script>
